name: Deploy Web App to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps-web
  cancel-in-progress: false

jobs:
  deploy_web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key & Pinned Host Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMRv/Pu2EIwXzMN2cqi0pMJXcn/J5dBrfuWLKJ/r+O2C" >> ~/.ssh/known_hosts
          echo "tg.toanaas.vn ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMRv/Pu2EIwXzMN2cqi0pMJXcn/J5dBrfuWLKJ/r+O2C" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Web to VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -euo pipefail
            echo '=== Pulling Web App Repo on VPS ==='
            cd /opt/toanaas/webapp
            git fetch origin --prune
            git checkout main
            git pull origin main

            echo '=== Restarting Web Service ==='
            systemctl restart toanaas-web.service

            echo '=== Verifying Active Web Service ==='
            systemctl is-active toanaas-web.service
            curl -f http://127.0.0.1:8000/health

            echo '=== WEB DEPLOY SUCCESS ==='
          "
