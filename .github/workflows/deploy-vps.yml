name: Deploy Web App to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps-web
  cancel-in-progress: false

jobs:
  deploy_web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Web to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=10 "$VPS_USER@$VPS_HOST" "
            set -euo pipefail
            echo '=== Pulling Web App Repo on VPS ==='
            cd /opt/toanaas/webapp
            git fetch origin --prune
            git checkout main
            git pull origin main

            echo '=== Restarting Web Service ==='
            systemctl restart toanaas-web.service

            echo '=== Verifying Active Web Service ==='
            systemctl is-active toanaas-web.service
            curl --retry 5 --retry-delay 2 --retry-connrefused -f http://127.0.0.1:8000/health

            echo '=== WEB DEPLOY SUCCESS ==='
          "
