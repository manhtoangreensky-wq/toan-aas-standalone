name: Deploy Web App to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps-web
  cancel-in-progress: false

jobs:
  deploy_web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Web to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "=== Pulling Web App Repo on VPS ==="
            cd /opt/toanaas/webapp
            git fetch origin --prune
            git checkout main
            git pull origin main

            echo "=== Restarting Web Service ==="
            systemctl restart toanaas-web.service

            echo "=== Verifying Active Web Service ==="
            systemctl is-active toanaas-web.service
            curl -f http://127.0.0.1:8000/health

            echo "=== WEB DEPLOY SUCCESS ==="
