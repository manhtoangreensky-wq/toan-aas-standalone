name: Báo lỗi TOAN AAS Web App
description: Báo lỗi có thể tái hiện từ một case đã khóa
title: "[BUG] WA-XX — "
labels: [lỗi, có-lỗi, chờ-sửa]
body:
  - type: markdown
    attributes:
      value: >-
        Không dán token, mật khẩu, backup code, Admin ID, email đầy đủ, số điện thoại hoặc raw customer record
  - type: input
    id: case_id
    attributes:
      label: Mã case
      placeholder: WA-17
    validations:
      required: true
  - type: input
    id: spec_id
    attributes:
      label: SPEC_ID
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: BASE / HEAD / runtime SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Môi trường
      options: [local-temp-only, local-render, CI, deployed, ship-gated, security-gated, live-money-gated, live]
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Role
    validations:
      required: true
  - type: input
    id: viewport
    attributes:
      label: Viewport
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Bước tái hiện
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected / Actual
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Bằng chứng
      description: Link screenshot, JSON, terminal output, console/network và SHA liên quan.
    validations:
      required: true
  - type: textarea
    id: counters
    attributes:
      label: Mutation / call counters
      description: Ghi provider, wallet, production data, ENV và GitHub mutation.
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction confirmation
      options:
        - label: Tôi đã che dữ liệu nhạy cảm và không đính kèm raw customer record.
          required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [🔴 chặn-bán-hàng, 🟠 nặng, 🟡 vừa, 🟢 nhẹ]
    validations:
      required: true
  - type: dropdown
    id: retest_state
    attributes:
      label: Trạng thái retest
      options: [có-lỗi, chờ-sửa, chờ-test-lại]
    validations:
      required: true
