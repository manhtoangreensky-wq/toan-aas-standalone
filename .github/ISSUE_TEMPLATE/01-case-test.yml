name: Case kiểm thử TOAN AAS Web App
description: Ghi kết quả một case từ KIEM-THU/DANH-SACH-CASE.md
title: "[TEST] WA-XX — "
labels: []
body:
  - type: input
    id: case
    attributes:
      label: Mã case
      placeholder: WA-01
    validations:
      required: true
  - type: input
    id: sha
    attributes:
      label: BASE / HEAD / runtime SHA
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Kết quả và bằng chứng
      description: Ghi route, role, viewport, output và link artifact.
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Kết luận
      options: [PASS, FAIL, BLOCKED]
    validations:
      required: true
