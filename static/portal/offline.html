<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063b47">
  <title>TOAN AAS — Ngoại tuyến</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { align-items: center; background: #063b47; color: #effdfe; display: flex; margin: 0; min-height: 100vh; min-height: 100dvh; padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left)); }
    main { margin: 0 auto; max-width: 34rem; }
    h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); letter-spacing: -.03em; line-height: 1.25; margin: 0 0 .75rem; }
    p { color: #c0dde2; font-size: 16px; line-height: 1.625; margin: 0 0 1rem; }
    a { color: #7dd3fc; }
    .offline-language-switcher { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 1.25rem; }
    .offline-language-switcher button { min-height: 44px; padding: 8px 12px; border: 1px solid rgba(125, 211, 252, .45); border-radius: 10px; background: rgba(255, 255, 255, .08); color: #effdfe; font: inherit; cursor: pointer; }
    .offline-language-switcher button[aria-pressed="true"] { border-color: #5eead4; background: #0d9488; color: #ffffff; }
    .offline-language-switcher button:focus-visible,
    a:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 3px; }
  </style>
  <script src="/static/portal/offline.js" defer></script>
</head>
<body>
  <main>
    <p aria-hidden="true">TOAN AAS</p>
    <nav class="offline-language-switcher" aria-label="Chọn ngôn ngữ" data-offline-language-switcher>
      <button type="button" data-offline-locale="vi" aria-pressed="true">Tiếng Việt</button>
      <button type="button" data-offline-locale="en" aria-pressed="false">English</button>
      <button type="button" data-offline-locale="zh" aria-pressed="false">中文</button>
    </nav>
    <h1 data-offline-title>Bạn đang ngoại tuyến</h1>
    <p data-offline-message role="status" aria-live="polite">Trang công khai này hiện không thể tải từ mạng. Hãy kết nối lại Internet rồi thử. Thông tin tài khoản và không gian riêng tư không được lưu vào bộ nhớ ngoại tuyến.</p>
    <p><a href="/welcome" data-offline-retry>Thử lại</a></p>
  </main>
</body>
</html>
