<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background & Aura Glows -->
    <radialGradient id="botAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e599" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#00d2f0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030706" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Obsidian Gradients -->
    <linearGradient id="cyberHelmet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162c22"/>
      <stop offset="50%" stop-color="#091510"/>
      <stop offset="100%" stop-color="#040a07"/>
    </linearGradient>

    <linearGradient id="visorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599"/>
      <stop offset="50%" stop-color="#00d2f0"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="neonEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10f5a5"/>
      <stop offset="100%" stop-color="#00d2f0"/>
    </linearGradient>

    <!-- Drop Shadows & Neon Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Aura Background -->
  <circle cx="100" cy="100" r="92" fill="url(#botAura)"/>
  <circle cx="100" cy="100" r="88" fill="#06120d" stroke="#00e599" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Cyber Ear Modules / Headset Nodes -->
  <rect x="22" y="80" width="16" height="40" rx="8" fill="url(#cyberHelmet)" stroke="url(#neonEar)" stroke-width="2" filter="url(#neonGlow)"/>
  <rect x="162" y="80" width="16" height="40" rx="8" fill="url(#cyberHelmet)" stroke="url(#neonEar)" stroke-width="2" filter="url(#neonGlow)"/>
  <circle cx="30" cy="100" r="4" fill="#10f5a5" filter="url(#neonGlow)"/>
  <circle cx="170" cy="100" r="4" fill="#10f5a5" filter="url(#neonGlow)"/>

  <!-- Top Cyber Antenna / AI Node -->
  <path d="M96 26 L104 26 L102 46 L98 46 Z" fill="#162c22" stroke="#00e599" stroke-width="1.5"/>
  <circle cx="100" cy="24" r="6" fill="#10f5a5" filter="url(#neonGlow)"/>

  <!-- Bot Face/Helmet Contour -->
  <path d="M50 64 C50 42, 150 42, 150 64 C158 88, 158 126, 142 148 C128 164, 72 164, 58 148 C42 126, 42 88, 50 64 Z" 
        fill="url(#cyberHelmet)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Inner Face Plate -->
  <path d="M58 72 C58 56, 142 56, 142 72 C148 94, 148 122, 136 138 C124 150, 76 150, 64 138 C52 122, 52 94, 58 72 Z" 
        fill="#040907" stroke="rgba(0, 229, 153, 0.25)" stroke-width="1"/>

  <!-- Holographic Cyber Visor / Eyes -->
  <rect x="62" y="82" width="76" height="34" rx="14" fill="url(#visorGlass)" filter="url(#neonGlow)" opacity="0.95"/>
  
  <!-- Cyber Eye Pupils (Intelligent & Expressive) -->
  <ellipse cx="84" cy="99" rx="8" ry="9" fill="#ffffff"/>
  <circle cx="86" cy="97" r="4" fill="#03120b"/>
  <circle cx="88" cy="95" r="1.5" fill="#ffffff"/>

  <ellipse cx="116" cy="99" rx="8" ry="9" fill="#ffffff"/>
  <circle cx="114" cy="97" r="4" fill="#03120b"/>
  <circle cx="116" cy="95" r="1.5" fill="#ffffff"/>

  <!-- Visor Specular Reflection -->
  <path d="M68 86 Q100 84 132 86 Q100 89 68 86 Z" fill="#ffffff" opacity="0.6"/>

  <!-- Intelligent Micro-Smile / Cyber Mouth Interface -->
  <path d="M88 132 Q100 138 112 132" stroke="#10f5a5" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#neonGlow)"/>

  <!-- Smart Cyber Cheek Dots -->
  <circle cx="70" cy="124" r="2" fill="#00d2f0" opacity="0.8"/>
  <circle cx="130" cy="124" r="2" fill="#00d2f0" opacity="0.8"/>

  <!-- Collar / Neck Base Interface -->
  <path d="M78 162 L122 162 L132 178 L68 178 Z" fill="url(#cyberHelmet)" stroke="#00e599" stroke-width="1.5"/>
  <rect x="90" y="167" width="20" height="3" rx="1.5" fill="#10f5a5" filter="url(#neonGlow)"/>
</svg>
