stop_condition: >-
  Historical R37 evidence is partial local-QA evidence on Git HEAD
  45b84de83ee9b475bb4366c3ddc2af85b82297c4 plus the recorded dirty source overlay;
  source hashes were stable during the run. It is not main/deployed/live. R37
  covered /wallet/topup, /dashboard and /features at desktop 1440x900, normal and
  reduced motion, cold navigation and same-session reload (12 rows), plus one
  Features scroll reveal (13 cases total). Normal main/sidebar entrance start/end
  matched in all 6 normal route/reload cases; no main entrance appeared in the 6
  reduced cases. One Features reveal sample completed in 72 frames with max gap
  17.1ms and no gap >50ms. Page/console/failed/external request findings and CLS
  were zero in the captured cases. R37 did not instrument animationcancel or
  horizontal overflow, so those are not accepted as zero. Cold-load performance
  still fails: long tasks reached 563ms, LoAF 610ms/517ms blocking, and rAF gap
  999.9ms; reduced-motion also had cold-load tasks up to 381ms and a 466.5ms gap.
  The 6 same-session reload rows had no >200ms long task, but transfer sizes for
  portal.js/integration.js remained unchanged, so cache-hit behavior is unproven.
  Dashboard normal has one zero-geometry, CSS-hidden assurance target still
  is-pending; it is not visible customer content. The R37 browser JSON was emitted,
  but the server wrapper ended with SERVER_EXIT=-1 / exit 1; do not report the
  whole runner as clean exit. Attribution is partial and does not prove motion is
  the cause. Do not edit product motion code without a reproducible matching RED
  regression tied to a specific behavior and recorded source SHA/overlay. Preserve
  all dirty and untracked work. Never touch unrelated sessions, production,
  providers, wallet or deployment.
  Latest browser evidence R38c is also PARTIAL: Dashboard shell markers are
  present, but dashboard_rendered is a harness false negative and two early
  MutationObserver errors prevent a valid animation lifecycle trace. Its artifact
  is not bound to a HEAD/source fingerprint. R38d corrected the observer target
  but Chrome Crashpad self-terminated before a valid JSON was written. A fresh
  temporary dependency install was blocked by sandbox permissions; escalated
  execution was rejected, so do not bypass it. The focused static motion-fallback
  and dashboard-stability suites passed 8 tests and node syntax passed, but neither
  replaces browser acceptance. WA-35/WA-36 remain open; make no product code change
  without a matching browser reproduction and RED regression. For R39 the Owner
  approved an isolated TEMP runtime and scoped TEMP/network permission was granted;
  two pip installs still failed because the Python process remapped its temporary
  unpack directory to a different per-exec AppContainer TEMP. No server packages
  were installed and no R39 browser run occurred. Do not repeat pip, elevate, or
  bypass the sandbox; continue only when a browser-enabled local runtime is
  available without crossing that boundary. Current portal-motion.js SHA256
  C70752BAE488EB8D91069173B6F7D9E41F09C73A2F6985526BACF41FB0159326 differs from
  previously recorded overlay 8779D4F57A1B560BF817BC07CD2BB01B39885153D49D3CBF4035DE590C76C366.
  The file was already dirty at entry and was not edited in this turn; provenance
  and change time are unknown. Its current diff is 40 insertions/15 deletions,
  including customer entrance clear delay 760 to 1200 ms and IntersectionObserver
  target classification changes. R38 evidence cannot be attributed to this
  current source until a fresh HEAD+overlay rebaseline is recorded.
