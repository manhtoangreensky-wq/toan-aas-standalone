      background: #060913;
    }

      width: 100%;
      height: 100%;
      display: block;
    }
    .node {
      cursor: pointer;
      stroke: #0f172a;
      stroke-width: 1px;
      transition: fill-opacity 0.2s, stroke-width 0.2s;
    }
    .node:hover {
      stroke: #f8fafc;
      stroke-width: 2px;
    }
    .node-label {

      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      user-select: none;
    }
    .tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      color: #f8fafc;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
    }
    .tooltip-title {
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
      word-break: break-all;
    }
    .tooltip-stat {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 2px;
      color: #cbd5e1;
    }

        .on("mousemove", (e, d) => {
          tooltip.style.display = "block";
          tooltip.style.left = (e.pageX + 15) + "px";
          tooltip.style.top = (e.pageY + 15) + "px";
          tooltip.innerHTML = `
            <div class="tooltip-title">${d.data.path || d.data.name}</div>
            <div class="tooltip-stat"><span>Parsed Size:</span><strong>${formatBytes(d.data.size)}</strong></div>
            <div class="tooltip-stat"><span>Gzip Estimate:</span><strong>${formatBytes(d.data.gzip_size)}</strong></div>
            <div class="tooltip-stat"><span>Share:</span><strong>${((d.value / rootNode.value) * 100).toFixed(1)}%</strong></div>
          `;
        })
        .on("mouseleave", () => {
          tooltip.style.display = "none";
        });

      cell.append("text")
        .attr("class", "node-label")
        .attr("x", 4)
        .attr("y", 14)
        .text(d => (d.x1 - d.x0 > 50 && d.y1 - d.y0 > 25) ? d.data.name : "");

      cell.append("text")
        .attr("class", "node-sublabel")
        .attr("x", 4)
        .attr("y", 26)
        .text(d => (d.x1 - d.x0 > 70 && d.y1 - d.y0 > 38) ? formatBytes(d.data.size) : "");
    }

    window.zoomTo = function(node) {
      updateChart(node);
    };

    window.zoomToDepth = function(depth) {
      let curr = currentFocus;
      let crumbs = [];
      while (curr) {
        crumbs.unshift(curr);
        curr = curr.parent;
      }
      if (crumbs[depth]) updateChart(crumbs[depth]);
    };

    window.addEventListener("resize", renderTreemap);
    renderTreemap();
  </script>
</body>
</html>
